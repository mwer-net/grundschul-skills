<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A · Uhren mit Willi – Willi erklärt, große Uhren, wenig Text</title>
<link rel="stylesheet" href="blatt.css">
<script src="abbildungen.js"></script>
</head>
<body class="kl2 sw">
<section class="seite">
  <div class="namenszeile"><span class="name">Name:</span><span class="datum">Datum:</span></div>
  <span class="loesung-marke">Lösung</span>
  <div class="kopf">
    <div class="titel">
      <h1>Uhren lesen mit Willi</h1>
      <div class="ziel">Ich kann volle und halbe Stunden ablesen.</div>
    </div>
    <div class="tipp"><img class="figur" style="--figur:90px" src="bilder/willi-strich.png" alt="Willi"><div class="blase">Der kleine Zeiger zeigt die Stunde. Der große zeigt: voll oder halb.</div></div>
  </div>
  <div class="aufgabe">
    <span class="nr">1</span>
    <div class="anw"><span class="text">Wie spät ist es? Schreibe auf.</span></div>
    <div class="koerper">
      <div class="reihe" style="--spalten:3">
        <div class="zelle beispiel"><x-uhr zeit="2:00" groesse="120"></x-uhr><span class="antwort breit" data-l="2 Uhr"></span></div>
        <div class="zelle"><x-uhr zeit="6:30" groesse="120"></x-uhr><span class="antwort breit" data-l="halb 7"></span></div>
        <div class="zelle"><x-uhr zeit="10:00" groesse="120"></x-uhr><span class="antwort breit" data-l="10 Uhr"></span></div>
      </div>
    </div>
  </div>
  <div class="aufgabe">
    <span class="nr">2</span>
    <div class="anw"><span class="text">Zeichne die Zeiger ein.</span></div>
    <div class="koerper">
      <div class="reihe" style="--spalten:3">
        <div class="zelle"><b>5 Uhr</b><x-uhr loesung="5:00" groesse="120"></x-uhr></div>
        <div class="zelle"><b>halb 3</b><x-uhr loesung="2:30" groesse="120"></x-uhr></div>
        <div class="zelle"><b>halb 9</b><x-uhr loesung="8:30" groesse="120"></x-uhr></div>
      </div>
    </div>
  </div>
  <div class="aufgabe">
    <span class="nr">3</span>
    <div class="anw"><span class="text">Wann stehst du auf? Zeichne die Zeiger ein.</span></div>
    <div class="koerper"><div class="reihe" style="--spalten:3"><div class="zelle"><x-uhr groesse="120"></x-uhr></div></div></div>
  </div>
</section>
</body>
</html>
