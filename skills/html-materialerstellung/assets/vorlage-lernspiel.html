<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernspiel</title>
<link rel="stylesheet" href="blatt.css">
<script src="abbildungen.js"></script>
</head>
<body class="kl3 farbe palette-himmel">
<section class="seite">
  <div class="kopf">
    <div class="titel">
      <h1>Name des Spiels</h1>
      <div class="ziel">Ihr übt zusammen und habt Spaß.</div>
    </div>
  </div>
  <div class="aufgabe">
    <span class="nr">1</span>
    <div class="anw"><span class="text">So geht das Spiel:</span></div>
    <div class="koerper"><p class="text">Spielt zu zweit. Zieht abwechselnd eine Karte. Wer richtig antwortet, behält die Karte.</p></div>
  </div>
  <div class="karten" style="--spalten:3">
    <div class="karte"><div class="kartentext">Aufgabe 1</div></div>
    <div class="karte"><div class="kartentext">Aufgabe 2</div></div>
    <div class="karte"><div class="kartentext">Aufgabe 3</div></div>
    <div class="karte"><div class="kartentext">Aufgabe 4</div></div>
    <div class="karte"><div class="kartentext">Aufgabe 5</div></div>
    <div class="karte"><div class="kartentext">Aufgabe 6</div></div>
  </div>
</section>
</body>
</html>
