<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lesetext</title>
<link rel="stylesheet" href="blatt.css">
<script src="abbildungen.js"></script>
</head>
<body class="kl3 farbe palette-himmel">
<section class="seite">
  <div class="namenszeile"><span class="name">Name:</span><span class="datum">Datum:</span></div>
  <div class="kopf">
    <div class="titel">
      <h1>Überschrift des Textes</h1>
      <div class="ziel">Ich kann einen Text lesen und verstehen.</div>
    </div>
  </div>
  <p class="text">Hier steht dein Lesetext. Schreibe kurze Sätze. Ein neuer Gedanke beginnt in einer neuen Zeile.</p>
  <p class="text">Schreibe den Text weiter oder lass ihn von Claude schreiben.</p>
  <div class="aufgabe">
    <span class="nr">1</span>
    <div class="anw"><span class="text">Lies den Text. Was passiert zuerst?</span></div>
    <div class="koerper"><div class="schreiblinie"></div></div>
  </div>
  <div class="aufgabe">
    <span class="nr">2</span>
    <div class="anw"><span class="text">Kreuze an.</span></div>
    <div class="koerper"><x-richtigfalsch aussagen="Der Text hat eine Überschrift: r; Der Text hat keine Sätze: f"></x-richtigfalsch></div>
  </div>
</section>
</body>
</html>
